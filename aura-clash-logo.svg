<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo AuraClash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#241457"/>
      <stop offset="100%" stop-color="#07041a"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="60%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <path id="flame" d="M200 385 C128 345 118 250 170 188 C176 222 196 236 212 241 C200 190 226 140 262 108 C252 180 288 222 277 302 C271 352 242 388 200 385 Z"/>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- halos de aura -->
  <circle cx="256" cy="250" r="190" fill="none" stroke="#22d3ee" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="256" cy="250" r="160" fill="none" stroke="#d946ef" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="256" cy="250" r="130" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>

  <!-- resplandor detrás de las llamas -->
  <use href="#flame" fill="#22d3ee" opacity=".55" filter="url(#soft)"/>
  <use href="#flame" fill="#d946ef" opacity=".55" filter="url(#soft)" transform="translate(512,0) scale(-1,1)"/>

  <!-- auras enfrentadas -->
  <use href="#flame" fill="url(#cyan)" filter="url(#glow)"/>
  <use href="#flame" fill="url(#magenta)" filter="url(#glow)" transform="translate(512,0) scale(-1,1)" opacity=".92"/>

  <!-- choque central -->
  <circle cx="256" cy="250" r="70" fill="url(#core)"/>
  <g filter="url(#glow)" fill="#ffffff">
    <path d="M256 186 L267 239 L322 250 L267 261 L256 314 L245 261 L190 250 L245 239 Z"/>
    <path d="M256 186 L267 239 L322 250 L267 261 L256 314 L245 261 L190 250 L245 239 Z" transform="rotate(45 256 250) scale(.62) translate(156 152)"/>
  </g>

  <!-- título -->
  <text x="256" y="452" text-anchor="middle" font-family="'Trebuchet MS','Arial Black',Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="7" fill="url(#title)">AURACLASH</text>
</svg>
